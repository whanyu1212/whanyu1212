name: Update Profile Animation

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  # Job to generate space shooter animation
  generate_space_shooter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Run the CLI directly: the published gh-space-shooter action always
      # commits the GIF to the checked-out branch, but it is served from the
      # snake branch below and must not land on main.
      - name: Generate Space Shooter Animation
        run: |
          pip install "gh-space-shooter>=2,<3"
          gh-space-shooter ${{ github.repository_owner }} --output dist/space-shooter.gif --strategy random
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Animation to Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job to refresh the GitHub Stats lines in the profile card
  update_card_stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Refresh card stats
        run: python3 scripts/update_card_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git diff --quiet pictures/profile-card.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh profile card stats"
          git push
